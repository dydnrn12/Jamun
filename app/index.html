<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>자문자답</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#24211d; --sub:#8a8378; --line:#e5dfd4;
  --accent:#b5562c; --accent-soft:#f3e3d9; --q:#24211d;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1a17; --card:#26231f; --ink:#ece6dc; --sub:#9a9286; --line:#3a3530;
    --accent:#e08a5c; --accent-soft:#3b2b22; --q:#f3ede4; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;line-height:1.6}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
h1{font-size:22px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.iconbtn{background:none;border:none;color:var(--sub);font-size:22px;padding:6px 8px;cursor:pointer}
.hero{width:100%;text-align:left;background:var(--ink);color:var(--bg);border:none;border-radius:18px;
  padding:20px;margin-bottom:18px;cursor:pointer;font-family:inherit}
.hero b{display:block;font-size:19px;letter-spacing:-.3px}
.hero small{opacity:.7;font-size:13px}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px;outline:none}
.revisit{background:var(--accent-soft);border-radius:16px;padding:16px;margin-bottom:16px;cursor:pointer}
.revisit small{color:var(--accent);font-weight:600;font-size:12px}
.revisit .qt{font-size:16px;font-weight:600;margin-top:4px;color:var(--q)}
.revisit .meta{color:var(--sub);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card .qt{font-weight:600;color:var(--q);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin-top:6px}
.badge{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--sub);padding:40px 12px}
.sec{font-size:13px;color:var(--sub);margin:18px 0 8px;font-weight:600}
/* session */
.back{background:none;border:none;color:var(--sub);font-size:15px;padding:6px 0;cursor:pointer}
.step{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.3px;margin-top:8px}
.ask{font-size:22px;font-weight:700;line-height:1.45;margin:6px 0 4px;color:var(--q);word-break:keep-all}
.askhint{color:var(--sub);font-size:14px;margin-bottom:14px}
.situ{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 16px;
  font-size:14px;white-space:pre-wrap;color:var(--sub)}
.situ b{color:var(--ink);font-weight:600}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;line-height:1.6;outline:none;resize:vertical}
textarea:focus,.search:focus,input.opt:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.row .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--sub)}
.btn.danger{color:#c0392b}
.lenses{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.lens{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.lens.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lens.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.opt{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  padding:11px 14px;font-size:16px;font-family:inherit;outline:none;margin-bottom:8px}
.optpick{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer}
.optpick.on{border-color:var(--accent);background:var(--accent-soft)}
.optpick .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.optpick.on .dot{border-color:var(--accent);background:var(--accent)}
/* detail */
.dq{font-size:19px;font-weight:700;line-height:1.5;margin:10px 0 4px;color:var(--q);white-space:pre-wrap;word-break:keep-all}
.dmeta{color:var(--sub);font-size:13px;margin-bottom:12px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;margin-top:6px}
.ans{position:relative;margin-bottom:18px}
.ans::before{content:"";position:absolute;left:-23px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.ans .lab{font-size:12px;color:var(--accent);font-weight:700}
.ans .lq{font-size:13px;color:var(--sub)}
.ans .when{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
.ans .when button{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;padding:0 0 0 10px}
.ans .txt{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.decision{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin:6px 0 16px}
.decision small{color:var(--accent);font-weight:700;font-size:12px}
.decision ul{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:14px}
.decision li.pick{color:var(--ink);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:17px}
.hint{font-size:13px;color:var(--sub);margin:4px 0 10px}
.menu button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  color:var(--ink);border-radius:12px;padding:14px;margin-bottom:8px;font-size:15px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const NAME='주형';
const LENSES=[
  {k:'feel',  t:'기분',     q:`${NAME}아, 지금 기분이 정확히 어때?`, h:'찝찝한 건지, 화난 건지, 불안한 건지. 이름을 붙여봐.'},
  {k:'env',   t:'환경',     q:'이게 환경 탓일 수도 있어. 상황이나 구조가 뭘 만들고 있지?', h:'시간, 장소, 돈, 피로, 규칙… 사람 말고 판 자체.'},
  {k:'other', t:'그 사람',  q:'정말 그 사람이 문제일 수도 있어. 정확히 뭐가 걸려?', h:'참지 말고 솔직하게. 말투, 행동, 반복되는 패턴.'},
  {k:'me',    t:'나',       q:`혹시 ${NAME}이 네가 만든 부분은 없어?`, h:'탓하려는 게 아니라, 내가 바꿀 수 있는 몫을 찾는 거야.'},
  {k:'std',   t:'기준',     q:'여기서 내 기준이 뭐였지? 그 기준 아직 맞아?', h:'너무 높거나, 낡았거나, 남의 기준일 수도 있어.'},
  {k:'miss',  t:'놓친 것',  q:'내가 못 보고 있는 사정이나 상황이 있다면?', h:'상대 입장, 타이밍, 아직 모르는 정보.'},
  {k:'flex',  t:'유연하게', q:'꼭 이렇게만 봐야 해? 다른 해석 하나만 해봐.', h:'조금 더 너그러운 해석, 혹은 조금 더 냉정한 해석.'},
  {k:'flip',  t:'뒤집기',   q:'아예 다르게 생각해보면? 정반대로.', h:'문제가 아니라 기회라면? 내가 아니라 남의 일이라면? 10년 뒤라면?'},
  {k:'act',   t:'행동',     q:'지금 행동에 나서야 할 때야? 한다면 첫 한 걸음은?', h:'말할지, 정리할지, 부탁할지, 끊을지.'},
  {k:'move',  t:'그냥 움직여', q:'생각 그만하고 그냥 움직인다면, 뭐부터 할래?', h:'5분 안에 할 수 있는 몸 쓰는 일 하나.'},
  {k:'prod',  t:'생산성',   q:'근데 이 생각, 생산성 있어? 계속 붙잡을 가치가 있어?', h:'붙잡을 거면 이유를, 놓을 거면 놓는다고 적어.'},
];
const LMAP=Object.fromEntries(LENSES.map(l=>[l.k,l]));
const KEY='jamun.v2', OLD='jamun.v1';
let db=load(), view={name:'home',q:''}, flow=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.entries)return d}catch(e){}
  const d={entries:[]};
  try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.questions)o.questions.forEach(q=>d.entries.push(
    {id:q.id,at:q.at,situation:q.text,answers:q.answers.map(a=>({...a,lens:'free'})),options:[],choice:null,archived:!!q.archived}))}catch(e){}
  localStorage.setItem(KEY,JSON.stringify(d));return d;
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){const d=new Date(t);return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';
  if(s<86400)return Math.floor(s/3600)+'시간 전';const d=Math.floor(s/86400);if(d<30)return d+'일 전';
  if(d<365)return Math.floor(d/30)+'달 전';return Math.floor(d/365)+'년 전'}
const lastTouch=e=>Math.max(e.at,...e.answers.map(a=>a.at),e.decidedAt||0);
const getE=id=>db.entries.find(e=>e.id===id);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function go(v,push=true){view=v;if(push)history.pushState({v:v.name},'');render();scrollTo(0,0)}
window.onpopstate=()=>{if(view.name!=='home'){flow=null;view={name:'home',q:view.q||''};render()}};
function home(){if(history.state&&history.state.v)history.back();else{flow=null;go({name:'home',q:''},false)}}

function render(){
  const app=document.getElementById('app');
  if(view.name==='flow')return renderFlow(app);
  if(view.name==='detail')return renderDetail(app);
  renderHome(app);
}

/* ---------- home ---------- */
function renderHome(app){
  app.innerHTML=`
  <header><h1>자문<span>자답</span></h1><button class="iconbtn" onclick="openMenu()">⋯</button></header>
  <button class="hero" onclick="startFlow()"><b>${NAME}아, 지금 어때?</b><small>지금 머릿속에 있는 걸 한두 줄로 적고, 관점을 바꿔가며 스스로 답해보기</small></button>
  <input class="search" placeholder="지난 혼잣말 검색" value="${esc(view.q||'')}" oninput="view.q=this.value;renderList()">
  <div id="list"></div>`;
  renderList();
}
function renderList(){
  const el=document.getElementById('list');if(!el)return;
  let es=db.entries.filter(e=>!e.archived);
  const k=(view.q||'').toLowerCase();
  if(k)es=db.entries.filter(e=>e.situation.toLowerCase().includes(k)||e.answers.some(a=>a.text.toLowerCase().includes(k))||(e.options||[]).some(o=>o.toLowerCase().includes(k)));
  es.sort((a,b)=>lastTouch(b)-lastTouch(a));
  let h='';
  if(!k){
    const open=db.entries.filter(e=>!e.archived&&e.choice==null&&Date.now()-lastTouch(e)>3*86400000).sort((a,b)=>lastTouch(a)-lastTouch(b))[0];
    if(open)h+=`<div class="revisit" onclick="openE('${open.id}')"><small>아직 결론 안 난 혼잣말</small><div class="qt">${esc(open.situation)}</div><div class="meta">${ago(lastTouch(open))} · 다시 보면 다르게 보일 수도</div></div>`;
  }
  if(!es.length)h+=`<div class="empty">${db.entries.length?'찾는 게 없어.':'아직 기록이 없어.<br>위에 버튼 눌러서 지금 상태부터 적어봐.'}</div>`;
  else h+=`<div class="sec">${k?'검색 결과':'지난 혼잣말'}</div>`;
  for(const e of es){
    const pick=e.choice!=null&&e.options[e.choice];
    h+=`<div class="card" onclick="openE('${e.id}')"><div class="qt">${esc(e.situation)}</div>
    <div class="meta"><span>${ago(e.at)}</span>${e.answers.length?`<span>관점 ${e.answers.length}</span>`:''}${pick?`<span class="badge">→ ${esc(pick)}</span>`:(e.options.length?'<span>선택 전</span>':'')}</div></div>`;
  }
  const arch=db.entries.filter(e=>e.archived).length;
  if(!k&&arch)h+=`<div class="row"><button class="btn ghost" onclick="showArchived()">보관함 ${arch}</button></div>`;
  el.innerHTML=h;
}
function showArchived(){
  const el=document.getElementById('list');
  el.innerHTML=`<div class="sec">보관함</div>`+db.entries.filter(e=>e.archived).sort((a,b)=>lastTouch(b)-lastTouch(a)).map(e=>
    `<div class="card" onclick="openE('${e.id}')"><div class="qt">${esc(e.situation)}</div><div class="meta"><span>${ago(e.at)}</span></div></div>`).join('')
    +`<div class="row"><button class="btn ghost" onclick="renderList()">← 돌아가기</button></div>`;
}

/* ---------- flow ---------- */
function startFlow(existingId){
  const e=existingId?getE(existingId):null;
  const used=e?new Set(e.answers.map(a=>a.lens)):new Set();
  flow={id:e?e.id:null,step:e?'lens':'situ',deck:shuffle(LENSES.filter(l=>!used.has(l.k)).map(l=>l.k)),cur:0,options:e?e.options.slice():[],choice:e?e.choice:null};
  if(!flow.deck.length)flow.deck=shuffle(LENSES.map(l=>l.k));
  go({name:'flow'});
}
function curE(){return flow.id?getE(flow.id):null}
function renderFlow(app){
  const e=curE();
  if(flow.step==='situ'){
    app.innerHTML=`<button class="back" onclick="home()">← 닫기</button>
    <div class="step">지금</div>
    <div class="ask">${NAME}아, 지금 무슨 일이야?</div>
    <div class="askhint">길게 안 써도 돼. 혼잣말하듯 한두 줄.</div>
    <textarea id="t" placeholder="예) 오늘 수업 끝나고 학부모 연락 때문에 계속 찝찝함"></textarea>
    <div class="row"><span class="sp"></span><button class="btn primary" onclick="saveSitu()">다음 →</button></div>`;
    draftBind('situ');return;
  }
  if(flow.step==='lens'){
    const k=flow.deck[flow.cur%flow.deck.length],L=LMAP[k];
    const done=new Set(e.answers.map(a=>a.lens));
    app.innerHTML=`<button class="back" onclick="home()">← 닫기</button>
    <div class="situ"><b>지금</b> · ${esc(e.situation)}</div>
    <div class="step">관점 · ${L.t}</div>
    <div class="ask">${L.q}</div>
    <div class="askhint">${L.h}</div>
    <textarea id="t" placeholder="${NAME}이 생각은…"></textarea>
    <div class="row"><button class="btn ghost" onclick="nextLens()">다른 관점 ↻</button><span class="sp"></span>
      <button class="btn primary" onclick="saveLens('${k}')">답하고 다음</button></div>
    <div class="lenses">${LENSES.map(l=>`<span class="lens ${l.k===k?'on':done.has(l.k)?'done':''}" onclick="pickLens('${l.k}')">${l.t}</span>`).join('')}</div>
    <div class="row"><span class="sp"></span><button class="btn" onclick="flow.step='opts';render()">이제 선택지 정리하기 →</button></div>`;
    draftBind(e.id+'.'+k);return;
  }
  if(flow.step==='opts'){
    const o=flow.options.concat(['','','']).slice(0,Math.max(3,flow.options.length+1));
    app.innerHTML=`<button class="back" onclick="flow.step='lens';render()">← 관점으로</button>
    <div class="situ"><b>지금</b> · ${esc(e.situation)}</div>
    <div class="step">선택지</div>
    <div class="ask">틀 밖까지 포함해서, 할 수 있는 건 뭐가 있어?</div>
    <div class="askhint">말도 안 되는 것도 하나 넣어봐. 아무것도 안 하기도 선택지야.</div>
    <div id="opts">${o.map((v,i)=>`<input class="opt" data-i="${i}" value="${esc(v)}" placeholder="선택지 ${i+1}" oninput="optInput()">`).join('')}</div>
    <div class="row"><span class="sp"></span><button class="btn primary" onclick="toChoose()">다음 →</button></div>`;
    return;
  }
  if(flow.step==='choose'){
    app.innerHTML=`<button class="back" onclick="flow.step='opts';render()">← 선택지로</button>
    <div class="situ"><b>지금</b> · ${esc(e.situation)}</div>
    <div class="step">결정</div>
    <div class="ask">${NAME}아, 너는 어떻게 할래?</div>
    <div class="askhint">지금 고른 게 정답일 필요는 없어. 일단 하나.</div>
    ${flow.options.map((v,i)=>`<div class="optpick ${flow.choice===i?'on':''}" onclick="flow.choice=${i};render()"><span class="dot"></span><span>${esc(v)}</span></div>`).join('')}
    <div class="row"><button class="btn ghost" onclick="finish(true)">아직 못 정하겠어</button><span class="sp"></span><button class="btn primary" onclick="finish()">이걸로 간다</button></div>`;
  }
}
function draftBind(key){const ta=document.getElementById('t'),dk='draft.'+key;ta.value=localStorage.getItem(dk)||'';
  ta.oninput=()=>localStorage.setItem(dk,ta.value);ta.dataset.dk=dk;setTimeout(()=>ta.focus(),60)}
function saveSitu(){const ta=document.getElementById('t'),v=ta.value.trim();if(!v)return;
  const e={id:uid(),at:Date.now(),situation:v,answers:[],options:[],choice:null};db.entries.push(e);save();localStorage.removeItem(ta.dataset.dk);
  flow.id=e.id;flow.step='lens';render();scrollTo(0,0)}
function saveLens(k){const ta=document.getElementById('t'),v=ta.value.trim();
  if(v){const e=curE();e.answers.push({id:uid(),lens:k,text:v,at:Date.now()});save();localStorage.removeItem(ta.dataset.dk);toast('남겼어')}
  nextLens()}
function nextLens(){flow.cur++;if(flow.cur>=flow.deck.length){flow.cur=0}render();scrollTo(0,0)}
function pickLens(k){const i=flow.deck.indexOf(k);if(i>=0)flow.cur=i;else{flow.deck.push(k);flow.cur=flow.deck.length-1}render()}
function optInput(){const ins=[...document.querySelectorAll('input.opt')];
  if(ins[ins.length-1].value.trim()&&ins.length<8){const n=document.createElement('input');n.className='opt';n.dataset.i=ins.length;n.placeholder='선택지 '+(ins.length+1);n.oninput=optInput;document.getElementById('opts').appendChild(n)}}
function toChoose(){const v=[...document.querySelectorAll('input.opt')].map(i=>i.value.trim()).filter(Boolean);
  if(!v.length){toast('하나는 적어줘');return}
  const prev=flow.choice!=null?flow.options[flow.choice]:null;flow.options=v;flow.choice=prev!=null&&v.includes(prev)?v.indexOf(prev):null;
  const e=curE();e.options=v;save();flow.step='choose';render()}
function finish(skip){const e=curE();e.options=flow.options;
  if(!skip){if(flow.choice==null){toast('하나 골라줘');return}e.choice=flow.choice;e.decidedAt=Date.now()}
  save();const id=e.id;flow=null;view={name:'detail',id};history.replaceState({v:'detail'},'');render();scrollTo(0,0);toast(skip?'나중에 다시 보자':'정했다')}

/* ---------- detail ---------- */
function openE(id){go({name:'detail',id})}
function renderDetail(app){
  const e=getE(view.id);if(!e)return home();
  const ans=e.answers.map(a=>{const L=LMAP[a.lens];return `<div class="ans">
    <div class="when"><span class="lab">${L?L.t:'답'}</span><span>${fmt(a.at)}<button onclick="editAns('${a.id}')">수정</button><button onclick="delAns('${a.id}')">삭제</button></span></div>
    ${L?`<div class="lq">${L.q}</div>`:''}<div class="txt">${esc(a.text)}</div></div>`}).join('');
  app.innerHTML=`<button class="back" onclick="home()">← 목록</button>
  <div class="dq">${esc(e.situation)}</div>
  <div class="dmeta">${new Date(e.at).toLocaleDateString('ko-KR')} ${fmt(e.at).split(' ')[1]} · 관점 ${e.answers.length}개</div>
  ${e.options.length?`<div class="decision"><small>${e.choice!=null?'그래서 이렇게 하기로':'선택지 (아직 결정 전)'}</small>
    <ul>${e.options.map((o,i)=>`<li class="${i===e.choice?'pick':''}">${esc(o)}</li>`).join('')}</ul></div>`:''}
  <div class="actions">
    <button class="btn primary" onclick="startFlow('${e.id}')">관점 더 해보기</button>
    <button class="btn" onclick="flowTo('${e.id}','opts')">${e.options.length?'선택지 다시':'선택지 정리'}</button>
    <button class="btn" onclick="editSitu()">수정</button>
    <button class="btn" onclick="toggleArchive()">${e.archived?'보관 해제':'보관'}</button>
    <button class="btn danger" onclick="delE()">삭제</button>
  </div>
  ${e.answers.length?`<div class="timeline">${ans}</div>`:'<div class="empty">아직 답한 관점이 없어.</div>'}`;
}
function flowTo(id,step){startFlow(id);flow.step=step;render()}
function sheet(title,val,onOk){const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="box"><h3>${title}</h3><textarea id="si"></textarea><div class="row"><span class="sp"></span><button class="btn" id="sc">취소</button><button class="btn primary" id="so">저장</button></div></div>`;
  document.body.appendChild(s);const ta=s.querySelector('#si');ta.value=val||'';setTimeout(()=>ta.focus(),50);
  s.querySelector('#sc').onclick=()=>s.remove();s.onclick=e=>{if(e.target===s)s.remove()};
  s.querySelector('#so').onclick=()=>{const v=ta.value.trim();if(!v)return;onOk(v);s.remove()}}
function editSitu(){const e=getE(view.id);sheet('지금 상황 수정',e.situation,v=>{e.situation=v;save();render()})}
function editAns(id){const e=getE(view.id),a=e.answers.find(x=>x.id===id);sheet('답 수정',a.text,v=>{a.text=v;save();render()})}
function delAns(id){if(!confirm('이 답을 지울까?'))return;const e=getE(view.id);e.answers=e.answers.filter(x=>x.id!==id);save();render()}
function toggleArchive(){const e=getE(view.id);e.archived=!e.archived;save();render();toast(e.archived?'보관함으로 옮겼어':'다시 꺼냈어')}
function delE(){if(!confirm('이 기록 전체를 지울까? 되돌릴 수 없어.'))return;db.entries=db.entries.filter(e=>e.id!==view.id);save();home()}

/* ---------- backup ---------- */
function openMenu(){
  const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="box menu"><h3>백업</h3><div class="hint">기록은 이 폰 안에만 저장돼. 가끔 백업 파일로 내려받아 둬.</div>
  <button id="ex">📤 백업 파일 내보내기</button><button id="im">📥 백업 파일 불러오기</button><button id="cl">닫기</button></div>`;
  document.body.appendChild(s);s.onclick=e=>{if(e.target===s)s.remove()};
  s.querySelector('#cl').onclick=()=>s.remove();
  s.querySelector('#ex').onclick=()=>{const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);const d=new Date();
    a.download=`자문자답-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;a.click();s.remove()};
  s.querySelector('#im').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
    i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
      const list=d.entries||(d.questions||[]).map(q=>({id:q.id,at:q.at,situation:q.text,answers:q.answers.map(a=>({...a,lens:'free'})),options:[],choice:null}));
      if(!Array.isArray(list))throw 0;if(!confirm(`기록 ${list.length}개를 불러올까? 지금 기록과 합쳐져.`))return;
      const ids=new Set(db.entries.map(e=>e.id));list.forEach(e=>{if(!ids.has(e.id))db.entries.push(e)});save();s.remove();render();toast('불러왔어')}
      catch(e){alert('백업 파일을 읽을 수 없어.')}};r.readAsText(i.files[0])};i.click()};
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();
</script>
</body>
</html>
